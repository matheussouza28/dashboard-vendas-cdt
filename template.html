<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de Vendas CDT</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f3; --surface:#fcfcfb; --surface-2:#f0f1ee; --border:#e2e3df;
  --text:#0b0b0b; --text-2:#52514e; --text-3:#8a8985;
  --brand:#1F4E3D; --brand-ink:#ffffff; --accent:#2a78d6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --fil:#2a78d6; --ref:#eb6834;
  --good:#008300; --bad:#e34948;
  --grid:#e8e9e5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121311; --surface:#1a1a19; --surface-2:#232422; --border:#2e2f2c;
    --text:#ffffff; --text-2:#c3c2b7; --text-3:#8d8c85;
    --brand:#2c6b54; --accent:#3987e5;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    --fil:#3987e5; --ref:#d95926;
    --good:#3fae3f; --bad:#e66767;
    --grid:#2a2b28;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121311; --surface:#1a1a19; --surface-2:#232422; --border:#2e2f2c;
  --text:#ffffff; --text-2:#c3c2b7; --text-3:#8d8c85;
  --brand:#2c6b54; --accent:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --fil:#3987e5; --ref:#d95926;
  --good:#3fae3f; --bad:#e66767;
  --grid:#2a2b28;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header.top{background:var(--brand);color:var(--brand-ink);padding:14px 18px}
header.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
header.top h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}
header.top .meta{font-size:12px;opacity:.85}
main{max-width:1200px;margin:0 auto;padding:14px 14px 40px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px}
.tab{border:1px solid var(--border);background:var(--surface);color:var(--text-2);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.tab .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters label{font-size:12px;color:var(--text-2)}
.filters select,.filters button{font:inherit;font-size:13px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.filters button[aria-pressed="true"]{background:var(--surface-2);border-color:var(--text-3);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--text-2)}
.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.3px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--text-3);margin-top:2px}
.kpi .d.up{color:var(--good)} .kpi .d.down{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.grid.two{grid-template-columns:3fr 2fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;min-width:0}
.card h2{font-size:14px;margin:0 0 2px;font-weight:600}
.card .sub{font-size:12px;color:var(--text-2);margin-bottom:10px}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:6px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:2px;border-radius:2px}
.legend i.rect{height:10px;border-radius:2px}
svg{display:block;width:100%;height:auto;overflow:visible}
.chart-wrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;z-index:5;min-width:140px}
.tip .t{color:var(--text-2);margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:10px}
.tip .r b{font-variant-numeric:tabular-nums}
.tip .r i{display:inline-block;width:10px;height:2px;margin-right:6px;vertical-align:middle;border-radius:1px}
.axis text{fill:var(--text-3);font-size:11px}
.axis line,.grid-line{stroke:var(--grid);stroke-width:1}
.axis .base{stroke:var(--border)}
.lbl{fill:var(--text-2);font-size:11px}
.lbl.strong{fill:var(--text);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--text-2);font-weight:600;position:sticky;top:0;background:var(--surface)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow:auto;max-height:420px}
.bar-cell{display:flex;align-items:flex-start;gap:8px;min-width:0}
.bar-cell .who{min-width:0}
td.wrap{white-space:normal;overflow-wrap:break-word}
.sub-unit{font-size:11px;color:var(--text-3);margin-top:2px}
@media(max-width:600px){.col-x{display:none}.bar-cell .b{max-width:34px}}
.bar-cell .b{height:8px;border-radius:4px;background:var(--accent);flex:0 0 auto;max-width:60px;margin-top:5px}
.toggle{font:inherit;font-size:12px;background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;color:var(--text-2);cursor:pointer}
.small{font-size:12px;color:var(--text-3)}
footer{max-width:1200px;margin:10px auto 0;padding:0 14px;font-size:12px;color:var(--text-3)}
.hidden{display:none!important}

/* --- relatório do dia --- */
#report{display:none}
body.mode-report #dash-content{display:none}
body.mode-report #report{display:block}
.rep-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.rep-controls input[type=date],.rep-controls input[type=number],.rep-controls select,.rep-controls button{font:inherit;font-size:13px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.rep-controls input[type=number]{width:90px}
.rep-controls .primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.rep-controls .seg button[aria-pressed="true"]{background:var(--surface-2);border-color:var(--text-3);font-weight:600}
.rep-wrap{overflow:hidden}
.rep{width:940px;background:#0f4a2a;color:#fff;font-family:"Poppins","Segoe UI",system-ui,Roboto,Arial,sans-serif;padding:0 0 26px;box-sizing:border-box}
.rep .head{background:#0b3d22;text-align:center;padding:18px 20px 14px}
.rep .head h3{margin:0;font-size:26px;font-weight:700;letter-spacing:.2px}
.rep .head p{margin:6px 0 0;font-size:16px;opacity:.85}
.rep .body{display:grid;grid-template-columns:1fr 322px;gap:30px;padding:24px 26px 0}
.rep .panel{background:#135329;border-radius:12px;padding:14px 16px}
.rep table{width:100%;border-collapse:collapse;font-size:20px}
.rep th{font-size:14px;letter-spacing:1px;text-transform:uppercase;color:#e8f1ea;padding:6px 2px 10px;border-bottom:1px solid #2f7a49;text-align:left;font-weight:600;position:static;background:none}
.rep th.n{text-align:right}
.rep td{padding:10px 2px;border:0;white-space:nowrap;color:#fff}
.rep td.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.rep .medal{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#0f2a18;margin-right:12px;vertical-align:-3px}
.rep .m1{background:#e8b923}.rep .m2{background:#b8bcc2}.rep .m3{background:#c77b3a}
.rep .rk{display:inline-block;width:24px;margin-right:12px;font-size:15px;color:#cfe0d4;text-align:center}
.rep tr.total td{border-top:1px solid #fff;font-size:24px;font-weight:700;padding-top:12px}
.rep .week{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:300px}
.rep .week .l{font-size:15px;letter-spacing:1px;text-transform:uppercase;font-weight:600;color:#e8f1ea}
.rep .week .v{font-size:88px;font-weight:800;line-height:1.05;margin:26px 0 22px;font-variant-numeric:tabular-nums}
.rep .week .u{font-size:16px;opacity:.85}
.rep .banner{margin:20px 26px 0;border-radius:10px;padding:18px;text-align:center;font-size:22px;font-weight:700;background:#b32a2a}
.rep .banner.ok{background:#1e9e4a}
.rep .foot{margin:14px 26px 0;font-size:12px;opacity:.6;text-align:right}
</style>
</head>
<body>
<header class="top"><div class="row">
  <div><h1 id="title">Dashboard de Vendas — Cartão de Todos</h1><div class="meta" id="meta"></div></div>
  <div class="meta" id="period-label"></div>
</div></header>
<main>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="dash-content">
  <div class="filters" id="filters">
    <label for="mes">Período</label>
    <select id="mes"></select>
    <button type="button" data-preset="day" id="btn-day">Hoje</button>
    <button type="button" data-preset="mtd">Mês atual</button>
    <button type="button" data-preset="prev">Mês anterior</button>
    <button type="button" data-preset="30">Últimos 30 dias</button>
    <button type="button" data-preset="ytd">Ano 2026</button>
  </div>
  <section class="kpis" id="kpis"></section>
  <div class="grid two">
    <div class="card">
      <div class="hd"><div><h2 id="daily-title">Vendas por dia</h2><div class="sub" id="daily-sub"></div></div><button class="toggle" id="daily-toggle">Ver tabela</button></div>
      <div class="legend" id="daily-legend"></div>
      <div class="chart-wrap" id="daily-chart"><div class="tip" id="tip"></div></div>
      <div class="tbl-wrap hidden" id="daily-table"></div>
    </div>
    <div class="card">
      <div class="hd"><div><h2>Filiação × Refiliação</h2><div class="sub">no período selecionado</div></div></div>
      <div class="legend"><span><i class="rect" style="background:var(--fil)"></i>Filiação</span><span><i class="rect" style="background:var(--ref)"></i>Refiliação</span></div>
      <div class="chart-wrap" id="mix-chart"></div>
    </div>
  </div>
  <div class="grid two" style="margin-top:12px">
    <div class="card">
      <div class="hd"><div><h2>Vendas por mês</h2><div class="sub" id="monthly-sub">jan–set 2026</div></div></div>
      <div class="legend" id="monthly-legend"></div>
      <div class="chart-wrap" id="monthly-chart"></div>
    </div>
    <div class="card">
      <div class="hd"><div><h2 id="rank-title">Ranking de vendedores</h2><div class="sub" id="rank-sub"></div></div><button class="toggle" id="rank-more">Ver todos</button></div>
      <div class="tbl-wrap" id="rank-table"></div>
    </div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="hd"><div><h2>Resumo por unidade</h2><div class="sub" id="units-sub"></div></div></div>
    <div class="tbl-wrap" id="units-table"></div>
  </div>
  </div>
  <section id="report">
    <div class="rep-controls">
      <span class="seg" id="rep-groups"></span>
      <label for="rep-date">Dia</label><input type="date" id="rep-date">
      <label for="rep-meta">Meta da semana</label><input type="number" id="rep-meta" min="0" step="10">
      <button type="button" class="primary" id="rep-png">Baixar imagem (PNG)</button>
      <span class="small" id="rep-note"></span>
    </div>
    <div class="rep-wrap"><div class="rep" id="rep">
      <div class="head"><h3 id="rep-title"></h3><p id="rep-meta-l"></p></div>
      <div class="body">
        <div class="panel"><table id="rep-table"></table></div>
        <div class="panel week"><div class="l">Total da semana</div><div class="v" id="rep-week"></div><div class="u" id="rep-week-u">vendas</div></div>
      </div>
      <div class="banner" id="rep-banner"></div>
      <div class="foot" id="rep-foot"></div>
    </div></div>
  </section>
</main>
<footer>Fonte: CTN — relatório Filiação por Vendedor (filiação + refiliação). <span id="foot-meta"></span></footer>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const UNITS=D.unidades; // fixed order → fixed colors
const COLORS=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)'];
const colorOf=u=>COLORS[UNITS.indexOf(u)%COLORS.length];
const NICE={'BELEM CENTRO':'Belém Centro','MANAUS CENTRO':'Manaus Centro','MANAUS NORTE':'Manaus Norte','OSASCO':'Osasco','PARINTINS':'Parintins','PORTO ALEGRE NORTE':'Porto Alegre Norte','ALVORADA':'Alvorada'};
const nice=u=>NICE[u]||u;
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_L=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const fmt=n=>n.toLocaleString('pt-BR');
const pct=n=>(n*100).toFixed(1).replace('.',',')+'%';
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const br=s=>{const [y,m,d]=s.split('-');return d+'/'+m+'/'+y;};
const brShort=s=>{const [y,m,d]=s.split('-');return d+'/'+m;};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d);};
const daily=D.daily; // [dia, franquia, vendas, fil, ref]
const vend=D.vend;   // [mes, franquia, vendedor, vendas, fil, ref]
const LAST=D.periodo.fim, FIRST=D.periodo.inicio; const recent=D.recent||[]; const HOJE=D.hoje||LAST; const DAY=(recent.some(r=>r[0]===HOJE)?HOJE:LAST);
(function(){const b=document.getElementById('btn-day');if(b)b.textContent=DAY===HOJE?'Hoje':'Último dia ('+DAY.slice(8,10)+'/'+DAY.slice(5,7)+')';})();
const months=[...new Set(daily.map(r=>r[0].slice(0,7)))].sort();

// ---------- state ----------
let unit='ALL', range={a:LAST.slice(0,7)+'-01', b:LAST, kind:'mtd'};
const params=new URLSearchParams(location.search); const h=location.hash.replace('#','').toUpperCase().replace(/_/g,' ');
const initU=(params.get('unidade')||h||'').toUpperCase().replace(/_/g,' ');
if(UNITS.includes(initU)) unit=initU;

// ---------- tabs ----------
const tabs=document.getElementById('tabs');
function mkTab(id,label,color){const b=document.createElement('button');b.className='tab';b.role='tab';b.dataset.u=id;if(color){const i=document.createElement('span');i.className='dot';i.style.background=color;b.appendChild(i);}b.appendChild(document.createTextNode(label));b.onclick=()=>{if(id==='REPORT'){document.body.classList.add('mode-report');document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.u==='REPORT'));history.replaceState(null,'','#relatorio');renderReport();return;}document.body.classList.remove('mode-report');unit=id;history.replaceState(null,'',id==='ALL'?location.pathname:'#'+id.toLowerCase().replace(/ /g,'_'));render();};tabs.appendChild(b);}
if(UNITS.length>1){mkTab('ALL','Todas as unidades');UNITS.forEach(u=>mkTab(u,nice(u),colorOf(u)));}else{mkTab('ALL',nice(UNITS[0]),colorOf(UNITS[0]));}mkTab('REPORT','📋 Relatório do dia');

// ---------- filters ----------
const sel=document.getElementById('mes');
months.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=MESES_L[+m.slice(5,7)-1]+' '+m.slice(0,4);sel.appendChild(o);});
sel.value=LAST.slice(0,7);
sel.onchange=()=>{const m=sel.value;const end=m===LAST.slice(0,7)?LAST:iso(new Date(+m.slice(0,4),+m.slice(5,7),0));range={a:m+'-01',b:end,kind:'month'};render();};
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{
  const p=b.dataset.preset; const lm=LAST.slice(0,7);
  if(p==='day') range={a:DAY,b:DAY,kind:'day'};
  if(p==='mtd') range={a:lm+'-01',b:LAST,kind:'mtd'};
  if(p==='prev'){const d=new Date(+lm.slice(0,4),+lm.slice(5,7)-1,0);const m=iso(d).slice(0,7);range={a:m+'-01',b:iso(d),kind:'prev'};}
  if(p==='30') range={a:addDays(LAST,-29),b:LAST,kind:'30'};
  if(p==='ytd') range={a:FIRST,b:LAST,kind:'ytd'};
  render();
});

// ---------- helpers ----------
function inRange(d,r){return d>=r.a&&d<=r.b;}
function filt(rows,r,u){return rows.filter(x=>inRange(x[0],r)&&(u==='ALL'||x[1]===u));}
function sum(rows,i){return rows.reduce((s,x)=>s+x[i],0);}
function prevRange(r){if(r.kind==='day'){const p=addDays(r.a,-7);return {a:p,b:p,label:'mesmo dia da semana passada ('+brShort(p)+')'};}const len=Math.round((pd(r.b)-pd(r.a))/86400000)+1;if(r.kind==='mtd'||r.kind==='month'||r.kind==='prev'){const d=new Date(+r.a.slice(0,4),+r.a.slice(5,7)-2,1);const m=iso(d).slice(0,7);const dayB=+r.b.slice(8,10);const lastOfPrev=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();return {a:m+'-01',b:m+'-'+String(Math.min(dayB,lastOfPrev)).padStart(2,'0'),label:'mesmo período de '+MESES[+m.slice(5,7)-1]};}return {a:addDays(r.a,-len),b:addDays(r.a,-1),label:len+' dias anteriores'};}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
const svgNS='http://www.w3.org/2000/svg';
function S(tag,attrs){const e=document.createElementNS(svgNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
function cw(id,min){const e=document.getElementById(id);return Math.max(min||320,Math.floor(e.clientWidth||e.parentElement.clientWidth||760));}
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,150);});
function niceTicks(max,n){if(max<=0)return[0];const raw=max/n;const p=Math.pow(10,Math.floor(Math.log10(raw)));const c=[1,2,2.5,5,10].find(c=>c*p>=raw)*p;const t=[];for(let v=0;v<=max+1e-9;v+=c)t.push(v);if(t[t.length-1]<max)t.push(t[t.length-1]+c);return t;}

// ---------- render ----------
function render(){
  const inRep=document.body.classList.contains('mode-report');
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',inRep?t.dataset.u==='REPORT':t.dataset.u===unit));
  if(inRep&&typeof renderReport==='function')renderReport();
  document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.preset===range.kind));
  if(range.kind==='month'||range.kind==='mtd'||range.kind==='prev') sel.value=range.a.slice(0,7);
  document.getElementById('title').textContent=unit==='ALL'?(D.titulo||'Dashboard de Vendas — Cartão de Todos'):(UNITS.length===1?(D.titulo||'Dashboard de Vendas'):'Dashboard de Vendas — '+nice(unit));
  document.getElementById('meta').textContent='Atualizado em '+D.atualizado_em+' · dados de '+br(FIRST)+' a '+br(LAST);
  document.getElementById('foot-meta').textContent='Base: '+fmt(D.total)+' vendas · '+UNITS.length+' unidades.';
  const plabel=br(range.a)+' – '+br(range.b);
  document.getElementById('period-label').textContent='Período: '+plabel;
  const rows=filt(daily,range,unit); const pr=prevRange(range); const prows=filt(daily,pr,unit);
  renderKpis(rows,prows,pr);
  renderDaily(rows,plabel);
  renderMix(rows);
  renderMonthly();
  renderRank();
  renderUnits(rows,prows,pr);
}

function renderKpis(rows,prows,pr){
  const k=document.getElementById('kpis');k.replaceChildren();
  const v=sum(rows,2),f=sum(rows,3),r=sum(rows,4),pv=sum(prows,2);
  const days=Math.round((pd(range.b)-pd(range.a))/86400000)+1;
  const daysWithSales=new Set(rows.map(x=>x[0])).size;
  const delta=pv?((v-pv)/pv):null;
  const best=rows.reduce((m,x)=>{m[x[0]]=(m[x[0]]||0)+x[2];return m;},{});const bestDay=Object.entries(best).sort((a,b)=>b[1]-a[1])[0];
  const items=[

function loadMeta(){let v=null;try{v=localStorage.getItem(metaKey());}catch(e){}return v?+v:(+GRUPOS[repIdx].meta_semana||0);}
repMeta.value=loadMeta();
repMeta.onchange=()=>{try{localStorage.setItem(metaKey(),repMeta.value);}catch(e){}renderReport();};
repDate.onchange=renderReport;
function weekStart(d){const dt=pd(d);const back=(dt.getDay()-3+7)%7;dt.setDate(dt.getDate()-back);return iso(dt);}
function renderReport(){
  const rw=document.querySelector('.rep-wrap');const z=Math.min(1,(rw.clientWidth||940)/940);document.getElementById('rep').style.zoom=z;
  GRUPOS.forEach((g,i)=>{const b=document.getElementById('rep-g'+i);if(b)b.setAttribute('aria-pressed',i===repIdx);});
  const G=GRUPOS[repIdx];const day=repDate.value||DAY;const units=G.unidades;const meta=+repMeta.value||0;
  const ws=weekStart(day);
  const dayRows=daily.filter(x=>x[0]===day&&units.includes(x[1]));
  const per=units.map(u=>[u,sum(dayRows.filter(x=>x[1]===u),2)]).sort((a,b)=>b[1]-a[1]);
  const totDay=sum(dayRows,2);
  const totWeek=sum(daily.filter(x=>x[0]>=ws&&x[0]<=day&&units.includes(x[1])),2);
  document.getElementById('rep-title').textContent=G.titulo+' — '+br(day);
  document.getElementById('rep-meta-l').textContent='Meta da Semana: '+fmt(meta)+' vendas';
  const t=document.getElementById('rep-table');t.replaceChildren();const th=el('tr');th.appendChild(el('th',null,'Franquia'));th.appendChild(el('th','n','Vendas'));t.appendChild(th);
  per.forEach(([u,v],i)=>{const tr=el('tr');const td=el('td');if(i<3){const m=el('span','medal m'+(i+1),String(i+1));td.appendChild(m);}else td.appendChild(el('span','rk','#'+(i+1)));td.appendChild(document.createTextNode(u));tr.appendChild(td);tr.appendChild(el('td','n',fmt(v)));t.appendChild(tr);});
  const tr=el('tr','total');tr.appendChild(el('td',null,'TOTAL DO DIA'));tr.appendChild(el('td','n',fmt(totDay)));t.appendChild(tr);
  document.getElementById('rep-week').textContent=fmt(totWeek);
  document.getElementById('rep-week-u').textContent='vendas · semana de '+brShort(ws)+' a '+brShort(addDays(ws,6));
  const falta=meta-totWeek;const bn=document.getElementById('rep-banner');bn.classList.toggle('ok',falta<=0);
  bn.textContent=falta>0?'Faltam '+fmt(falta)+' vendas para bater a meta':'Meta da semana batida! '+fmt(-falta)+' vendas acima da meta';
  document.getElementById('rep-foot').textContent='Fonte: CTN · base atualizada em '+D.atualizado_em+(day===LAST?' (dia em andamento)':'');
  document.getElementById('rep-note').textContent=day===LAST?'Números do dia até a última atualização da base.':'';
}
document.getElementById('rep-png').onclick=async function(){
  const node=document.getElementById('rep');const day=repDate.value||DAY;
  if(!window.html2canvas){alert('Gerador de imagem indisponível; use Imprimir → salvar como PDF.');return;}
  this.disabled=true;this.textContent='Gerando…';
  try{const c=await html2canvas(node,{scale:2,backgroundColor:'#0f4a2a',useCORS:true});const name='relatorio_vendas_'+G.nome.toLowerCase().replace(/[^a-z0-9]+/g,'_')+'_'+day.replace(/-/g,'')+'.png';
    const dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;
    if(dl){const blob=await new Promise(r=>c.toBlob(r,'image/png'));try{await dl.save({filename:name,data:blob});}catch(e){if(e&&e.code!=='declined')throw e;}}
    else{const a=document.createElement('a');a.download=name;a.href=c.toDataURL('image/png');a.click();}}
  catch(e){alert('Não foi possível gerar a imagem: '+e.message);}
  this.disabled=false;this.textContent='Baixar imagem (PNG)';
};
if(location.hash.replace('#','').toLowerCase()==='relatorio'){document.body.classList.add('mode-report');document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.u==='REPORT'));renderReport();}
})();
</script>
</body>
