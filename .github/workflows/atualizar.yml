name: Atualizar dashboard de vendas

on:
  schedule:
    # A cada 30 min, das 06:15 às 23:45 (horário de Brasília = UTC-3).
    # O GitHub só aceita cron em UTC, por isso a janela vira duas linhas.
    - cron: '15,45 9-23 * * *'   # UTC 09:15–23:45  ->  BRT 06:15–20:45
    - cron: '15,45 0-2 * * *'    # UTC 00:15–02:45  ->  BRT 21:15–23:45
  workflow_dispatch:
    inputs:
      desde:
        description: 'Só para carga de histórico: primeiro dia (AAAA-MM-DD). Vazio = atualização normal.'
        required: false
        default: ''
      ate:
        description: 'Só para carga de histórico: último dia (AAAA-MM-DD).'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install --quiet requests openpyxl pandas

      - name: Baixar vendas do CTN
        env:
          CTN_COOKIE: ${{ secrets.CTN_COOKIE }}
          MINHACONTA_COOKIE: ${{ secrets.MINHACONTA_COOKIE }}
          CTN_DESDE: ${{ github.event.inputs.desde }}
          CTN_ATE: ${{ github.event.inputs.ate }}
        run: python scripts/ctn_fetch.py

      - name: Regenerar dashboard
        run: python build.py src --repo .

      - name: Publicar
        run: |
          rm -rf src
          git config user.name "Atualização automática"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Atualização automática $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')" || echo "nada a commitar"
          # Se alguem commitou na branch enquanto este job rodava, o push volta
          # rejeitado. Rebase por cima e tenta de novo. Se o rebase conflitar,
          # falha alto em vez de fingir sucesso: sem isso o HEAD fica destacado
          # no commit do outro e o push seguinte passa como no-op, descartando
          # esta rodada em silencio. A proxima rodada regenera tudo em 30 min.
          git push && exit 0
          echo "Push rejeitado - rebase na branch remota e nova tentativa."
          git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; echo "::error::Conflito no rebase; nada publicado nesta rodada."; exit 1; }
          git push

      # Avisa o vigia (cron-dashboards) que terminou: a linha do #log no Discord
      # sai em segundos, em vez de esperar a rodada de 10 min. Roda até em falha.
      - name: Avisar o vigia
        if: always()
        continue-on-error: true
        run: |
          curl -s -m 10 -X POST "https://cron-dashboards.matheus-grs1996.workers.dev/cutucar" \n            -H "Content-Type: application/json" \n            -d "{\"repo\":\"${{ github.repository }}\",\"run\":${{ github.run_id }}}" || true
